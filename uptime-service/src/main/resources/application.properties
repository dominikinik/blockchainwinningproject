spring.application.name=uptime-service

# PostgreSQL from the uptime-db module (docker compose -f ../uptime-db/docker-compose.yml up -d).
# History survives restarts. Untracked intervals are rejected; observation gaps are UNKNOWN.
spring.datasource.url=${UPTIME_DB_URL:jdbc:postgresql://localhost:5432/uptime}
spring.datasource.username=${UPTIME_DB_USER:uptime}
spring.datasource.password=${UPTIME_DB_PASSWORD:uptime}
# Schema is owned by uptime-db/init; only check that the entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Sampling (10 s), persistence (1 s) and deal settlement use separate scheduler threads
spring.task.scheduling.pool.size=3

uptime.sample-interval-ms=10000
uptime.flush-interval-ms=1000
uptime.scheduling-enabled=true
# Includes open windows and finalized events awaiting a successful commit
uptime.max-buffered-windows=3600
uptime.persistence-batch-size=60
uptime.retry-initial-ms=1000
uptime.retry-max-ms=30000
# Do not infer continuous coverage indefinitely from the last observation
uptime.max-observation-gap-ms=50000
# Optional remote health endpoint; unset keeps the local state probe
# uptime.probe.url=https://your-health-endpoint.example/health
uptime.probe.timeout-ms=1000
uptime.probe.status-field=status
uptime.probe.healthy-value=UP
uptime.probe.unhealthy-value=DOWN
# Optional stable, non-sensitive error classification field in the JSON response
# uptime.probe.reason-field=reason
uptime.max-range-seconds=86400
uptime.default-range-seconds=300

# Health also exposes pending persistence failures and rejected observations
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Swagger UI at /swagger-ui.html, actuator endpoints included
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.show-actuator=true

# Uptime deals: this service is the oracle of the uptime_deal Solana program (../uptime-deal).
# It settles each registered deal from its own recorded uptime once the deal's window ends.
deal.rpc-url=${SOLANA_RPC_URL:http://127.0.0.1:8899}
# Connect and read timeout of each RPC call, so a stalled node can't block the settlement loop
deal.rpc-timeout-ms=10000
deal.program-id=EesKoTPMwuRzvpfuZqNbyEf7mMrjUNXGCa2ugHAeVx2r
# Solana keypair file of the oracle, created on first start (gitignored); blank = new key per start
deal.oracle-keypair=${DEAL_ORACLE_KEYPAIR:.oracle-keypair.json}
deal.settle-grace-seconds=2
deal.poll-interval-ms=500
deal.max-duration-seconds=3600
deal.max-settle-attempts=10
deal.confirm-timeout-seconds=30
# Localnet/devnet: ask the faucet for 1 SOL when the oracle has less than 0.1 SOL for fees (0 disables)
deal.oracle-min-lamports=100000000
deal.oracle-airdrop-lamports=1000000000
