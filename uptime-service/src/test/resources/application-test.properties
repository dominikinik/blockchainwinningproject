# Tests run against in-memory H2 (PostgreSQL mode) so they need no running uptime-db container.
# schema.sql mirrors uptime-db/init/02-schema.sh; ddl-auto=validate still checks UptimeRecord against it.
spring.datasource.url=jdbc:h2:mem:uptime_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.jpa.defer-datasource-initialization=false
# Keep test output readable
logging.level.root=WARN
