# Uptime database module: PostgreSQL running locally in Docker.
#   start:  docker compose -f uptime-db/docker-compose.yml up -d
#   stop:   docker compose -f uptime-db/docker-compose.yml down
# Data is persisted in uptime-db/data/ (git-ignored). Scripts in init/ run only when data/ is empty;
# to re-initialise the schema, stop the container and delete data/.
name: uptime-db

services:
  postgres:
    image: postgres:17-alpine
    container_name: uptime-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: uptime
      POSTGRES_PASSWORD: uptime
      POSTGRES_DB: uptime
    ports:
      - "5432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uptime -d uptime"]
      interval: 2s
      timeout: 3s
      retries: 15
