# Tests run on in-memory H2 (PostgreSQL mode), one database per Spring context, so they need no monitor-db.
# schema.sql mirrors monitor-db/init/02-schema.sh.
spring.datasource.url=jdbc:h2:mem:monitor_${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
# Tests drive checks by hand and replace the Solana RPC with a mock
monitor.scheduler.enabled=false
monitor.blockchain.oracle-keypair=
monitor.blockchain.oracle-min-lamports=0
logging.level.root=WARN
