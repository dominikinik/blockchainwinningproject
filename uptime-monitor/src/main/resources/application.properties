spring.application.name=uptime-monitor
# uptime-service (the health provider) runs on 8080
server.port=${UPTIME_MONITOR_PORT:8082}

# Tracking events live in PostgreSQL from the monitor-db module
# (docker compose -f ../monitor-db/docker-compose.yml up -d). The schema is owned by monitor-db/init.
spring.datasource.url=${MONITOR_DB_URL:jdbc:postgresql://localhost:5433/monitor}
spring.datasource.username=${MONITOR_DB_USER:monitor}
spring.datasource.password=${MONITOR_DB_PASSWORD:monitor}

# Every tracked service's health endpoint is called this often
monitor.check-interval-ms=2000
# Must stay below the interval so a hanging service can't delay the next round
monitor.probe-timeout-ms=1500

management.endpoints.web.exposure.include=health
springdoc.swagger-ui.path=/swagger-ui.html

# The service tracked from startup: the provider (uptime-service). Deals registered without a serviceId are
# measured against it. A blank URL tracks nothing at startup.
monitor.default-service.id=${MONITOR_DEFAULT_SERVICE_ID:00000000-0000-0000-0000-000000008080}
monitor.default-service.health-url=${MONITOR_DEFAULT_SERVICE_URL:http://localhost:8080/api/health}

# GET /api/uptime: last 5 minutes by default, at most one day
monitor.history.default-range-seconds=300
monitor.history.max-range-seconds=86400

# Deal oracle of the uptime_deal Solana program (../uptime-deal). Deals close early when a failure makes 99%
# unreachable, settle when tracking finishes, and otherwise settle once their window (plus the grace) is over.
monitor.deal.program-id=EesKoTPMwuRzvpfuZqNbyEf7mMrjUNXGCa2ugHAeVx2r
monitor.deal.max-duration-seconds=3600
monitor.deal.settle-grace-seconds=2
monitor.deal.poll-interval-ms=500
monitor.deal.max-settle-attempts=10
monitor.deal.confirm-timeout-seconds=30

# Downtime reports are written on chain as SPL Memo transactions signed by the oracle key.
# false only logs them.
monitor.blockchain.enabled=${MONITOR_BLOCKCHAIN_ENABLED:true}
monitor.blockchain.rpc-url=${SOLANA_RPC_URL:http://127.0.0.1:8899}
monitor.blockchain.rpc-timeout-ms=10000
# Solana keypair file, created on first start (gitignored); blank = new key per start
monitor.blockchain.oracle-keypair=${MONITOR_ORACLE_KEYPAIR:.oracle-keypair.json}
# Localnet/devnet: ask the faucet for 1 SOL when the oracle has less than 0.1 SOL for fees (0 disables)
monitor.blockchain.oracle-min-lamports=100000000
monitor.blockchain.oracle-airdrop-lamports=1000000000
