spring.application.name=uptime-monitor
# uptime-service (the health provider) runs on 8080
server.port=${UPTIME_MONITOR_PORT:8082}

# The provider's health endpoint; called this often, and each result is sent to every active deal naming the oracle
monitor.health-url=${MONITOR_HEALTH_URL:http://localhost:8080/api/health}
monitor.check-interval-ms=2000
# Must stay below the interval so a hanging service can't delay the next round
monitor.probe-timeout-ms=1500

management.endpoints.web.exposure.include=health
springdoc.swagger-ui.path=/swagger-ui.html

# GET /api/uptime: last 5 minutes by default, at most one day (also how long results stay in memory)
monitor.history.default-range-seconds=300
monitor.history.max-range-seconds=86400

# The uptime_deal Solana program (../uptime-deal)
monitor.deal.program-id=EesKoTPMwuRzvpfuZqNbyEf7mMrjUNXGCa2ugHAeVx2r

# Observations are record_observation transactions signed by the oracle key. false only logs health results.
monitor.blockchain.enabled=${MONITOR_BLOCKCHAIN_ENABLED:true}
monitor.blockchain.rpc-url=${SOLANA_RPC_URL:http://127.0.0.1:8899}
monitor.blockchain.rpc-timeout-ms=10000
# Solana keypair file, created on first start (gitignored); blank = new key per start
monitor.blockchain.oracle-keypair=${MONITOR_ORACLE_KEYPAIR:.oracle-keypair.json}
# Localnet/devnet: ask the faucet for 1 SOL when the oracle has less than 0.1 SOL for fees (0 disables)
monitor.blockchain.oracle-min-lamports=100000000
monitor.blockchain.oracle-airdrop-lamports=1000000000
